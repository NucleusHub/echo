services:
  echo-server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/nucleus
      REDIS_URL: redis://redis:6379
      PORT: 3006
      # The apps dir is mounted read-only so Echo can auto-discover every app's
      # echo/manifest.echo.json at startup (registry/manifestLoader.js).
      APPS_DIR: /apps
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    volumes:
      - ./server:/app
      - echo_server_modules:/app/node_modules
      - ../../apps:/apps:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/api/echo/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  echo-client:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      API_TARGET: http://echo-server:3006
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      - ../../core:/app/core:ro
    depends_on:
      echo-server:
        condition: service_healthy

volumes:
  echo_server_modules:
