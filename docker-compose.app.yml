services:
  echo-server:
    build:
      context: ./server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-server"
      nucleus.app: "echo"
      nucleus.depends: "mongo,redis"
    environment:
      MONGODB_URI: mongodb://mongo:27017/nucleus
      REDIS_URL: redis://redis:6379
      PORT: 3006
      APPS_DIR: /apps
      JWT_SECRET: ${JWT_SECRET:-nucleus-jwt-secret}
    volumes:
      - ./server:/app
      - ../../core:/app/core:ro
      - ../../plugins:/app/plugins:ro
      - echo_server_modules:/app/node_modules
      - ../../apps:/apps:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/api/echo/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  echo-client:
    build:
      context: ./client
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "app-client"
      nucleus.app: "echo"
    environment:
      # virtiofs emits no inotify events; poll instead.
      CHOKIDAR_USEPOLLING: "true"
      API_TARGET: http://echo-server:3006
      NUCLEUS_HOST: ${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/vite.config.js:/app/vite.config.js
      # client/locales symlink dangles in the container; mount at its resolved target.
      - ./locales:/locales:ro
      - ../../core:/app/core:ro
      - ../../plugins:/app/plugins:ro
      - ../../widgets:/app/widgets:ro
      - ../../apps:/app/apps:ro
    depends_on:
      echo-server:
        condition: service_healthy

volumes:
  echo_server_modules:
